version: "3.8"

services:
  lattice:
    build: .
    container_name: lattice-operations-console
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    environment:
      - LATTICE_ENV=production
      - ADMIN_PASSWORD=admin123
      - TECH_PASSWORD=tech123
      - LATTICE_SESSION_TTL_HOURS=12
      - LATTICE_RATE_LIMIT_DISABLED=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/hostels"]
      interval: 30s
      timeout: 10s
      retries: 3
